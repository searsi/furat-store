<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر فرات</title><link rel="stylesheet" href="style.css"></head><body><header><strong>إدارة متجر فرات الصياد</strong><a href="index.html">عرض المتجر</a></header><main><p id="status"></p><form id="login" class="panel" hidden><h2>تسجيل الدخول</h2><input name="email" type="email" required placeholder="البريد الإلكتروني"><input name="password" type="password" required placeholder="كلمة المرور"><button>دخول</button></form><section id="dashboard" hidden><button id="logout">خروج</button><form id="settings" class="panel"><h2>إعدادات المتجر</h2><label>اسم المتجر<input name="name" required></label><label>واتساب بصيغة 9647XXXXXXXXX<input name="whatsapp" pattern="964[0-9]{10}"></label><label>الأقسام (كل قسم بسطر)<textarea name="categories" required></textarea></label><label>الشعار<input type="file" name="logo" accept="image/*"></label><button>حفظ الإعدادات</button></form><form id="product" class="panel"><h2 id="heading">إضافة منتج</h2><label>الاسم<input name="name" required></label><label>القسم<select name="category"></select></label><label>الوصف<textarea name="description"></textarea></label><label>الأوزان والأسعار (كل خيار بسطر، مثال: نصف كيلو | 18000)<textarea name="variants" required></textarea></label><label>الصورة<input name="image" type="file" accept="image/*"></label><label><input name="active" type="checkbox" checked style="width:auto"> متوفر للعرض</label><div class="actions"><button>حفظ المنتج</button><button type="button" id="reset">منتج جديد</button></div></form><h2>المنتجات</h2><div id="products" class="grid"></div></section></main><script type="module" src="admin.js"></script></body></html>
