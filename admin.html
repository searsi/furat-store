<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة متجر فرات</title><link rel="stylesheet" href="style.css?v=2"></head><body class="admin"><header><strong>إدارة متجر فرات الصياد</strong><a href="index.html">عرض المتجر</a></header><main><p id="status"></p><form id="login" class="panel" hidden><div class="login-mark">⬡</div><small>لوحة إدارة المتجر</small><h2>أهلاً بعودتك!</h2><p>سجل دخولك لإدارة منتجات متجر فرات الصياد.</p><input name="email" type="email" required placeholder="البريد الإلكتروني"><input name="password" type="password" required placeholder="كلمة المرور"><button>دخول</button></form><section id="dashboard" hidden><aside class="sidebar"><b>⬡ متجر فرات</b><button type="button" data-tab="list">المنتجات</button><button type="button" data-tab="product">إضافة منتج</button><button type="button" data-tab="settings">إعدادات المتجر</button><a href="index.html">عرض المتجر ↗</a><button id="logout">تسجيل الخروج</button></aside><div class="workspace"><div class="workspace-head"><small>مساحة عمل المتجر</small><h1>إدارة متجر فرات الصياد</h1></div><form id="settings" class="panel"><h2>إعدادات المتجر</h2><label>اسم المتجر<input name="name" required></label><label>واتساب بصيغة 9647XXXXXXXXX<input name="whatsapp" pattern="964[0-9]{10}"></label><label>الأقسام (كل قسم بسطر)<textarea name="categories" required></textarea></label><label>الشعار<input type="file" name="logo" accept="image/*"></label><button>حفظ الإعدادات</button></form><form id="product" class="panel"><h2 id="heading">إضافة منتج</h2><label>الاسم<input name="name" required></label><label>القسم<select name="category"></select></label><label>الوصف<textarea name="description"></textarea></label><label>الأوزان والأسعار (كل خيار بسطر، مثال: نصف كيلو | 18000)<textarea name="variants" required></textarea></label><label>الصورة<input name="image" type="file" accept="image/*"></label><label><input name="active" type="checkbox" checked style="width:auto"> متوفر للعرض</label><div class="actions"><button>حفظ المنتج</button><button type="button" id="reset">منتج جديد</button></div></form><section id="list"><div class="list-head"><h2>المنتجات</h2><button type="button" data-tab="product">＋ إضافة منتج</button></div><div id="products" class="grid"></div></section></div></section></main><script type="module" src="admin.js?v=2"></script></body></html>
